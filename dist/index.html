<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191e29">
  <meta name="description" content="Aprende Manim con Órbita oscuro u Old claro: dos estilos Aero, código Python y ejemplos interactivos.">
  <title>Manim · Órbita — Tu primera escena</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/old.css">
  <script src="assets/app.js" defer></script>
</head>
<body data-theme="orbita">
<script>
  try { if (localStorage.getItem('manim-appearance') === 'old') document.body.dataset.theme = 'old'; } catch {}
  document.documentElement.style.colorScheme = document.body.dataset.theme === 'old' ? 'light' : 'dark';
</script>
<div id="app"></div></body>
</html>
